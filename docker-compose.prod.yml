services:
  nginx:
    build: ./nginx
    ports:
      - "80:80" # Accessible via http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro # Fichiers buildés
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build: ./backend
    expose:
      - "3000" # Seulement en interne (via Nginx)
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=sqlite:./database.db
    command: npm run start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  sqlite:
    image: nouchka/sqlite3
    volumes:
      - ./db:/root/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
